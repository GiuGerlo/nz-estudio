name: Deploy a producción

on:
  push:
    branches: [production]

# Si llega otro push mientras este corre, el nuevo queda en cola (no cancela)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy commits a Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (con historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar archivos requeridos
        run: |
          test -f .deployignore || { echo "Falta .deployignore"; exit 1; }
          test -x .github/scripts/deploy.sh || chmod +x .github/scripts/deploy.sh

      - name: Cargar SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Ejecutar deploy (modo sequential)
        env:
          SSH_HOST:    ${{ secrets.SSH_HOST }}
          SSH_PORT:    ${{ secrets.SSH_PORT }}
          SSH_USER:    ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: .github/scripts/deploy.sh --mode=sequential
